name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  quality-and-tests:
    name: PHP ${{ matrix.php }} - lint, phpcs, psalm, phpunit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: json

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache/files
            ~/.cache/composer
            vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-
            ${{ runner.os }}-php-

      - name: Install dependencies (PHP 8.5 - ignore platform reqs)
        if: matrix.php == '8.5'
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=php

      - name: Install dependencies
        if: matrix.php != '8.5'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP Lint
        run: |
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      #- name: Run PHPCS
      #  run: vendor/bin/phpcs -q

      - name: Run Psalm
        run: vendor/bin/psalm --output-format=github --no-cache

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --colors=always
